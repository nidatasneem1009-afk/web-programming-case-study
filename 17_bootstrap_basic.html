<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bootstrap Basics</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div class="container my-4">
  <h1 class="display-5 text-primary">Bootstrap Container, Grid &amp; Typography</h1>
  <p class="lead">This is a lead paragraph. <small class="text-muted">Small muted text</small></p>
  <h4 class="text-success">Colors</h4>
  <p class="text-danger">Danger</p><p class="bg-warning p-2">Warning background</p>
  <div class="row g-3 my-3">
    <div class="col-12 col-md-4"><div class="p-3 bg-primary text-white">Column 1</div></div>
    <div class="col-6 col-md-4"><div class="p-3 bg-secondary text-white">Column 2</div></div>
    <div class="col-6 col-md-4"><div class="p-3 bg-dark text-white">Column 3</div></div>
  </div>
  <div class="row align-items-center">
    <div class="col-md-4"><img src="https://picsum.photos/id/1025/400/300" class="img-fluid rounded-circle" alt="Dog"></div>
    <div class="col-md-8"><img src="https://picsum.photos/id/1011/600/300" class="img-thumbnail" alt="Lake"></div>
  </div>
  <h4 class="mt-4">Student Table</h4>
  <div class="table-responsive">
    <table class="table table-striped table-hover table-bordered">
      <thead class="table-dark"><tr><th>#</th><th>Name</th><th>Course</th><th>Marks</th></tr></thead>
      <tbody>
        <tr><td>1</td><td>Anita</td><td>CSE</td><td>88</td></tr>
        <tr><td>2</td><td>Ravi</td><td>ECE</td><td>76</td></tr>
        <tr><td>3</td><td>Meena</td><td>Civil</td><td>91</td></tr>
      </tbody>
    </table>
  </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
