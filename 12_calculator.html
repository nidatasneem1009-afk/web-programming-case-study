<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Calculator</title>
<style>
 body{font-family:Arial;display:flex;justify-content:center;padding:20px}
 .calc{width:260px;border:2px solid #333;border-radius:10px;padding:10px;background:#222}
 #display{width:100%;height:50px;font-size:24px;text-align:right;margin-bottom:10px;box-sizing:border-box}
 .keys{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
 button{height:45px;font-size:18px;border:none;border-radius:6px;background:#eee;cursor:pointer}
 button.op{background:#f90} button.eq{background:#4caf50;color:#fff} button.clr{background:#e53935;color:#fff}
</style>
</head>
<body>
<div class="calc">
  <input id="display" readonly>
  <div class="keys">
    <button class="clr" onclick="clr()">C</button><button onclick="del()">&larr;</button>
    <button class="op" onclick="add('%')">%</button><button class="op" onclick="add('/')">/</button>
    <button onclick="add('7')">7</button><button onclick="add('8')">8</button><button onclick="add('9')">9</button>
    <button class="op" onclick="add('*')">*</button>
    <button onclick="add('4')">4</button><button onclick="add('5')">5</button><button onclick="add('6')">6</button>
    <button class="op" onclick="add('-')">-</button>
    <button onclick="add('1')">1</button><button onclick="add('2')">2</button><button onclick="add('3')">3</button>
    <button class="op" onclick="add('+')">+</button>
    <button onclick="add('0')">0</button><button onclick="add('.')">.</button>
    <button class="eq" style="grid-column:span 2" onclick="calc()">=</button>
  </div>
</div>
<script>
var d = document.getElementById("display");
function add(v) { d.value += v; }
function clr() { d.value = ""; }
function del() { d.value = d.value.slice(0, -1); }
function calc() {
  var m = d.value.match(/^(-?\d*\.?\d+)([+\-*\/%])(-?\d*\.?\d+)$/);   // number operator number
  if (!m) { d.value = "Error"; return; }
  var a = parseFloat(m[1]), op = m[2], b = parseFloat(m[3]), r;
  switch (op) {
    case "+": r = a + b; break;
    case "-": r = a - b; break;
    case "*": r = a * b; break;
    case "/": r = (b === 0) ? "Cannot divide by 0" : a / b; break;
    case "%": r = a % b; break;
  }
  d.value = r;
}</script>
</body>
</html>
