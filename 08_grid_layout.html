<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CSS Grid Layout</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:'Segoe UI',Arial,sans-serif;line-height:1.6}
  .grid{display:grid;grid-template-columns:200px 1fr 200px;grid-template-areas:
        "header header header" "nav main side" "footer footer footer";gap:12px;padding:12px;min-height:100vh}
  .grid > *{padding:20px;border-radius:8px;color:#fff}
  header{grid-area:header;background:#0b3d91;animation:slide 1.2s ease-out}
  nav{grid-area:nav;background:#2e7d32} main{grid-area:main;background:#6a1b9a}
  aside{grid-area:side;background:#ef6c00} footer{grid-area:footer;background:#333;text-align:center}
  h1{font-size:2rem;letter-spacing:1px} p{font-size:1rem}
  main:hover{animation:pulse 1s infinite}
  @keyframes slide{from{transform:translateY(-60px);opacity:0}to{transform:translateY(0);opacity:1}}
  @keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.02)}}
  @media (max-width:768px){
    .grid{grid-template-columns:1fr;grid-template-areas:"header" "nav" "main" "side" "footer"}
    h1{font-size:1.4rem}
  }
</style>
</head>
<body>
  <div class="grid">
    <header><h1>CSS Grid Responsive Layout</h1></header>
    <nav><p>Navigation</p></nav>
    <main><h2>Main Content</h2><p>Resize the browser to see the layout change using media queries.</p></main>
    <aside><p>Sidebar</p></aside>
    <footer><p>&copy; 2026 Web Programming Lab</p></footer>
  </div>
</body>
</html>
