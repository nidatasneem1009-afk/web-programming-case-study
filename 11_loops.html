<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Loops</title>
<style>body{font-family:Arial;margin:20px} input,button,select{padding:6px;margin:4px} #out{margin-top:10px;padding:10px;background:#eef;border-radius:6px}</style>
</head>
<body>
<h2>Loop Programs</h2>
<input type="number" id="n" value="5" min="1"> <br>
<button onclick="table()">Multiplication Table</button>
<button onclick="fact()">Factorial</button>
<button onclick="fib()">Fibonacci</button>
<button onclick="primes()">Primes</button>
<div id="out"></div>
<script>
var out = document.getElementById("out");
var num = () => parseInt(document.getElementById("n").value);

function table() {
  var n = num(), s = "";
  for (var i = 1; i <= 10; i++) s += n + " x " + i + " = " + n * i + "<br>";
  out.innerHTML = s;
}
function fact() {
  var n = num(), f = 1;
  for (var i = 2; i <= n; i++) f *= i;
  out.innerHTML = "Factorial of " + n + " = " + f;
}
function fib() {
  var n = num(), a = 0, b = 1, s = [];
  for (var i = 0; i < n; i++) { s.push(a); var t = a + b; a = b; b = t; }
  out.innerHTML = "Fibonacci (" + n + " terms): " + s.join(", ");
}
function primes() {
  var n = num(), list = [];
  for (var i = 2; i <= n; i++) {
    var isPrime = true;
    for (var j = 2; j * j <= i; j++) if (i % j === 0) { isPrime = false; break; }
    if (isPrime) list.push(i);
  }
  out.innerHTML = "Prime numbers up to " + n + ": " + list.join(", ");
}</script>
</body>
</html>
