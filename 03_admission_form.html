<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"><title>College Admission Form</title></head>
<body>
  <h2>College Admission Form</h2>
  <form action="#" method="post">
    <fieldset>
      <legend>Personal Details</legend>
      <label>Full Name: <input type="text" name="name" placeholder="Enter name" required></label><br><br>
      <label>Email: <input type="email" name="email" required></label><br><br>
      <label>Password: <input type="password" name="pwd"></label><br><br>
      <label>Date of Birth: <input type="date" name="dob"></label><br><br>
      Gender:
      <input type="radio" name="gender" value="M" id="m"><label for="m">Male</label>
      <input type="radio" name="gender" value="F" id="f"><label for="f">Female</label>
      <input type="radio" name="gender" value="O" id="o"><label for="o">Other</label>
    </fieldset><br>
    <fieldset>
      <legend>Academic Details</legend>
      Course:
      <select name="course">
        <option value="">--Select--</option>
        <option>B.Tech CSE</option><option>B.Tech ECE</option><option>B.Tech Mech</option>
      </select><br><br>
      Interests:
      <input type="checkbox" name="i" value="sports"> Sports
      <input type="checkbox" name="i" value="music"> Music
      <input type="checkbox" name="i" value="coding"> Coding<br><br>
      Address:<br><textarea name="address" rows="4" cols="40"></textarea><br><br>
      Upload Marksheet: <input type="file" name="doc">
    </fieldset><br>
    <input type="submit" value="Submit">
    <input type="reset" value="Reset">
  </form>
</body>
</html>
