<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dashboard</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
  <div class="container-fluid">
    <a class="navbar-brand" href="#">Dashboard</a>
    <button class="navbar-toggler" data-bs-toggle="collapse" data-bs-target="#menu"><span class="navbar-toggler-icon"></span></button>
    <div class="collapse navbar-collapse" id="menu">
      <ul class="navbar-nav ms-auto">
        <li class="nav-item"><a class="nav-link active" href="#">Home</a></li>
        <li class="nav-item"><a class="nav-link" href="#">Reports</a></li>
        <li class="nav-item dropdown">
          <a class="nav-link dropdown-toggle" href="#" data-bs-toggle="dropdown">Account</a>
          <ul class="dropdown-menu"><li><a class="dropdown-item" href="#">Profile</a></li>
            <li><a class="dropdown-item" href="#">Logout</a></li></ul>
        </li>
      </ul>
    </div>
  </div>
</nav>
<div class="container my-4">
  <div class="alert alert-success alert-dismissible fade show">
    <strong>Welcome!</strong> Your dashboard is ready.<button class="btn-close" data-bs-dismiss="alert"></button>
  </div>
  <div class="row g-3">
    <div class="col-sm-6 col-lg-3"><div class="card text-bg-primary"><div class="card-body">
      <h5 class="card-title">Users</h5><p class="display-6">1,250</p></div></div></div>
    <div class="col-sm-6 col-lg-3"><div class="card text-bg-success"><div class="card-body">
      <h5 class="card-title">Sales</h5><p class="display-6">$8.4k</p></div></div></div>
    <div class="col-sm-6 col-lg-3"><div class="card text-bg-warning"><div class="card-body">
      <h5 class="card-title">Orders</h5><p class="display-6">320</p></div></div></div>
    <div class="col-sm-6 col-lg-3"><div class="card text-bg-danger"><div class="card-body">
      <h5 class="card-title">Issues</h5><p class="display-6">12</p></div></div></div>
  </div>
  <div class="card mt-4"><div class="card-header">Progress</div><div class="card-body">
    <p>Project A</p><div class="progress mb-3"><div class="progress-bar bg-success" style="width:75%">75%</div></div>
    <p>Project B</p><div class="progress mb-3"><div class="progress-bar progress-bar-striped progress-bar-animated" style="width:45%">45%</div></div>
    <button class="btn btn-primary">Primary</button>
    <button class="btn btn-outline-secondary">Outline</button>
    <button class="btn btn-danger btn-sm">Small</button>
    <button class="btn btn-primary" disabled><span class="spinner-border spinner-border-sm"></span> Loading...</button>
    <div class="spinner-grow text-info ms-3" role="status"></div>
  </div></div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
