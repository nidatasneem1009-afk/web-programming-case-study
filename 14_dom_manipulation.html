<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DOM Manipulation</title>
<style>
 body{font-family:Arial;margin:20px}
 #box{width:250px;padding:20px;border:2px solid #333;margin:15px 0;transition:all .4s}
 button{padding:8px 12px;margin:3px}
</style>
</head>
<body>
<h2 id="title">DOM Manipulation Demo</h2>
<div id="box"><p id="msg">This text will change.</p></div>
<button onclick="changeText()">Change Text</button>
<button onclick="changeStyle()">Change Style</button>
<button onclick="addItem()">Add List Item</button>
<button onclick="removeItem()">Remove Item</button>
<button onclick="resetAll()">Reset</button>
<ul id="list"></ul>
<script>
var count = 0;
function changeText() {
  document.getElementById("msg").innerHTML = "<b>Content changed using innerHTML!</b>";
  document.getElementById("title").textContent = "Heading changed with textContent";
}
function changeStyle() {
  var box = document.getElementById("box");
  box.style.backgroundColor = "#ffe082";
  box.style.color = "#b71c1c";
  box.style.width = "350px";
  box.style.borderRadius = "15px";
  box.setAttribute("title", "Style updated");
  box.classList.toggle("done");
}
function addItem() {
  count++;
  var li = document.createElement("li");               // create element
  li.appendChild(document.createTextNode("Item " + count));
  document.getElementById("list").appendChild(li);     // append to DOM
}
function removeItem() {
  var list = document.getElementById("list");
  if (list.lastElementChild) { list.removeChild(list.lastElementChild); count--; }
}
function resetAll() { location.reload(); }</script>
</body>
</html>
